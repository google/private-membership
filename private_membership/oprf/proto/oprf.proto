edition = "2024";

package private_membership.oprf;

option optimize_for = LITE_RUNTIME;

import "private_membership/rlwe/client/proto/private_membership.proto";
import "private_membership/rlwe/client/proto/private_membership_rlwe.proto";


import option "google/protobuf/cpp_features.proto";

option java_outer_classname = "Oprf";
option features.(pb.cpp).string_type = STRING;
option features.field_presence = IMPLICIT;


option java_package = "com.google.privatemembership.oprf";

// Different use cases for the OPRF service.
// Next ID: 6
enum OprfUseCase {
  option features.(pb.cpp).enum_name_uses_string_view = false;

  OPRF_USE_CASE_UNDEFINED = 0;
  TEST_USE_CASE = 1;
  TEST_USE_CASE_2 = 2 [features.enforce_naming_style = STYLE_LEGACY];

  reserved 3, 4, 5;
  // Add more here...
}

message UseCase {
  oneof UseCase {
    option features.enforce_naming_style = STYLE_LEGACY;

    OprfUseCase oprf_use_case = 1;
    rlwe.RlweUseCase rlwe_use_case = 3;
  }
  reserved 2, 4;
}

// A request to encrypt plaintext IDs and values.
message OprfEncryptRequest {
  // Optional: specifies the key version to use. If set to 0 or not populated,
  // the service will use the recommended key version.
  int64 key_version = 1;

  // List of plaintext ID and value pairs that need to be encrypted.
  repeated PlaintextIdAndValue plaintexts = 2;

  // Specifying use case of the query.
  UseCase use_case = 5;

  // Message specifying a plaintext ID and value tuple.
  message PlaintextIdAndValue {
    // Plaintext ID.
    bytes plaintext_id = 1;

    // Plaintext value to be encrypted with key derived from plaintext_id.
    bytes plaintext_value = 2;

    // Public metadata for the encryption. If empty, it will be ignored.
    bytes public_metadata = 3;
  }

  reserved 3, 4;
}

// Response of encrypted IDs and values.
message OprfEncryptResponse {
  // Version of key that encrypted the input.
  //
  // If key_version is populated in the request, then the returned key_version
  // will be the same value.
  int64 key_version = 1;

  // List of ciphertexts representing the encryptions of the input plaintexts.
  repeated EncryptedIdAndValue ciphertexts = 2;

  // Message mapping the input plaintext ID to its encrypted ID and value
  // tuples.
  message EncryptedIdAndValue {
    // Plaintext ID associated with the encrypted ID and encrypted values.
    bytes plaintext_id = 1;

    // ID that is encrypted using the server key K. This is generated by
    // computing H(plaintext_id)^K and then applying a hash function (such as
    // SHA256).
    bytes encrypted_id = 2;

    // ID that is encrypted using the server key K, but without applying the
    // hash.
    bytes unhashed_encrypted_id = 4;

    // The encrypted value that is encrypted using a key that is
    // derived using the output of the HKDF of H(plaintext_id)^K. The mode of
    // encryption is specified in the metadata.
    bytes encrypted_value = 3;
  }

  message CiphertextMetadata {
    // The encryption scheme used to encrypt the value.
    EncryptionScheme value_encryption_scheme = 1;
  }

  CiphertextMetadata ciphertext_metadata = 3;
}

// A request to doubly encrypt already encrypted IDs.
message OprfReencryptRequest {
  // List of encrypted IDs to re-encrypt.
  repeated EncryptedId encrypted_ids = 6;

  // Specifying use case of the query.
  UseCase use_case = 7;

  // Optional: specifies the key version to use. If set to 0 or not populated,
  // the service will use the recommended key version.
  int64 key_version = 4;

  message EncryptedId {
    // The identifier encrypted using the elliptic curve commutative
    // cipher under an ephemeral key generated by the client. Before encryption,
    // the identifier is hashed using either SHA256 or a more computationally
    // expensive hash such as Argon2.
    bytes encrypted_id = 1;

    // Public metadata for the encryption. If empty, it will be ignored.
    bytes public_metadata = 2;
  }

  reserved 1, 2, 3, 5;
}

// A response containing doubly encrypted IDs.
message OprfReencryptResponse {
  // Version of key that encrypted the identifier-value pair.
  //
  // If key_version is populated in the request, then the returned key_version
  // will be the same value.
  int64 key_version = 1;

  // The requested encrypted_id entries that are re-encrypted using the elliptic
  // curve commutative cipher using the server’s key.
  //
  // The client will decrypt to simply get the identifier encrypted under the
  // server’s key. The client will use this to match with the associated
  // EncryptedBucket to see if there is a match or not. Additionally, the client
  // will use it to decrypt the AES encrypted value.
  repeated DoublyEncryptedId doubly_encrypted_ids = 2;

  // A proto message that holds the doubly encrypted ID.
  message DoublyEncryptedId {
    // The queried encrypted ID.
    bytes queried_encrypted_id = 1;

    // The double encryption of a client requested ID.
    bytes doubly_encrypted_id = 2;
  }

  message CiphertextMetadata {
    // The encryption scheme used to the encrypt the value for the use case at
    // the time of the Encrypt request.
    EncryptionScheme value_encryption_scheme = 1;
  }

  CiphertextMetadata ciphertext_metadata = 3;
}

message PlaintextIdAndMetadata {
  // Plaintext ID.
  bytes plaintext_id = 1;

  // Public metadata for the encryption. If empty, it will be ignored.
  bytes public_metadata = 2;
}

message EncryptedIdAndKey {
  // ID that is encrypted using the server key K. This is generated by
  // computing H(plaintext_id)^K and then applying a hash function (such as
  // SHA256).
  bytes encrypted_id = 1;

  // The encrypted key that is derived using the output of the HKDF of
  // H(plaintext_id)^K. This is used as the AES encryption key for the value.
  bytes encryption_key = 2;
}

service OprfService {
  // This service accepts requests to encrypt plaintext IDs and values with a
  // server key.
  rpc Encrypt(OprfEncryptRequest) returns (OprfEncryptResponse);

  // This service accepts requests to doubly encrypt requests with a server key.
  rpc Reencrypt(OprfReencryptRequest) returns (OprfReencryptResponse);
}
